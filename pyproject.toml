[project]
name = "job-poller"
version = "0.1.0"
description = "Poll public ATS job boards and email new postings that match your filters"
requires-python = ">=3.11"
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["jobpoller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
