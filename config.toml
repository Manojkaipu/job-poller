# Job poller settings. Companies live in companies.toml.

[settings]
# Hand-picked companies, then YC startups generated by scripts/import_yc.py and startups from
# startups.gallery generated by scripts/import_gallery.py.
companies_file = ["companies.toml", "companies_yc.toml", "companies_gallery.toml"]
state_file = "state/seen.json"
workers = 16                # boards fetched in parallel
alert_after_failures = 3    # email about a board that's gone (404, 410, 422) after this many failed runs in a row
alert_after_outage = 24     # ...and about any other failure (maintenance page, 5xx, 429, timeout) after this many

[filters]
# A title must contain one of these (whole words, any case; spaces also match "-" and "/").
include = [
  "machine learning", "ml", "deep learning", "ai engineer", "applied ai", "applied scientist",
  "research engineer", "research scientist", "member of technical staff", "llm", "nlp", "computer vision", "mlops",
  "inference", "search", "ranking", "recommendation", "retrieval",
  "data scientist", "data engineer", "analytics engineer",
  "software engineer", "software developer", "backend", "back end", "platform engineer",
  "infrastructure engineer",
]
# ...and none of these.
exclude = [
  "senior", "sr", "staff", "principal", "lead", "manager", "director", "head", "vp",
  "lmts", "smts", "pmts",  # Salesforce's lead/senior/principal member of technical staff
  "vice president", "architect", "distinguished", "fellow",
  "intern", "internship", "co op", "sales", "account executive", "recruiter",
]
# Ignored when checking excludes, so "staff" doesn't drop "Member of Technical Staff"
# ("Senior Member of Technical Staff" is still dropped, for "senior").
protect = ["member of technical staff"]
us_only = true                 # keep US and unspecified-remote postings
extra_locations = []           # also keep these places, e.g. ["Toronto"]
allow_unknown_location = false # drop postings that don't say where they are
# Only alert on postings the board says went up within this many hours (0 = no limit).
# Boards that don't publish a date are judged by when the poller first saw the posting.
max_age_hours = 24

# Recipients who want more than the filters above. Each profile gets its own email with every
# posting the filters above match plus the ones its `include_extra` terms match (same excludes,
# location and freshness rules). Addresses come from the environment variable named in `to_env`
# (a repository secret in CI, since this repo is public); keep them out of MAIL_TO.
[[profile]]
name = "robotics"
to_env = "MAIL_TO_ROBOTICS"
include_extra = [
  "robotics", "robotic", "robot", "robot learning", "physical ai", "embodied", "humanoid",
  "autonomy", "autonomous", "perception", "motion planning", "path planning", "controls software",
  "whole body control", "manipulation", "locomotion", "slam", "state estimation", "sensor fusion",
  "reinforcement learning", "simulation engineer", "mechatronics", "teleoperation", "embedded software",
]
# Not "controls engineer" (data center and power plant controls), "firmware" (consumer devices,
# ASICs) or "localization" (translation): checked against every board on 2026-10-26.
# Applied only to postings that come in through include_extra, never to the base matches.
exclude_extra = ["operator", "technician", "pilot", "assembler", "analyst", "specialist", "marketing", "chief"]
