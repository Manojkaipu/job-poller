# Job poller settings. Companies live in companies.toml.

[settings]
# Hand-picked companies, then YC startups generated by scripts/import_yc.py.
companies_file = ["companies.toml", "companies_yc.toml"]
state_file = "state/seen.json"
workers = 16                # boards fetched in parallel
alert_after_failures = 3    # email about a board after this many failed runs in a row

[filters]
# A title must contain one of these (whole words, any case; spaces also match "-" and "/").
include = [
  "machine learning", "ml", "deep learning", "ai engineer", "applied ai", "applied scientist",
  "research engineer", "research scientist", "member of technical staff", "llm", "nlp", "computer vision", "mlops",
  "inference", "search", "ranking", "recommendation", "retrieval",
  "data scientist", "data engineer", "analytics engineer",
  "software engineer", "software developer", "backend", "back end", "platform engineer",
  "infrastructure engineer",
]
# ...and none of these.
exclude = [
  "senior", "sr", "staff", "principal", "lead", "manager", "director", "head", "vp",
  "lmts", "smts", "pmts",  # Salesforce's lead/senior/principal member of technical staff
  "vice president", "architect", "distinguished", "fellow",
  "intern", "internship", "co op", "sales", "account executive", "recruiter",
]
# Ignored when checking excludes, so "staff" doesn't drop "Member of Technical Staff"
# ("Senior Member of Technical Staff" is still dropped, for "senior").
protect = ["member of technical staff"]
us_only = true                 # keep US and unspecified-remote postings
extra_locations = []           # also keep these places, e.g. ["Toronto"]
allow_unknown_location = false # drop postings that don't say where they are
# Only alert on postings the board says went up within this many hours (0 = no limit).
# Boards that don't publish a date are judged by when the poller first saw the posting.
max_age_hours = 24
